# Production stack: the published image with Postgres and Meilisearch. The app listens on
# 127.0.0.1:3000 for a reverse proxy on the host, which terminates HTTPS for $DOMAIN and sets
# X-Forwarded-For to the client address (overwriting what the client sent).
#   cp .env.example .env   # fill it in
#   docker compose up -d

services:
  app:
    image: ghcr.io/brofrong/chordtune:${CHORDTUNE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://chordtune:${POSTGRES_PASSWORD:?}@postgres:5432/chordtune
      BETTER_AUTH_URL: https://${DOMAIN:?}
      WEB_ORIGINS: https://${DOMAIN},capacitor://localhost,https://localhost
      MEILI_URL: http://meilisearch:7700
      MEILI_KEY: ${MEILI_MASTER_KEY:?}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_URL: ${SMTP_URL:-}
      # MAIL_FROM defaults in code to a localhost sender; set it explicitly once SMTP_URL points
      # at a real provider, or that provider's recipients will see no sender address.
      MAIL_FROM: ${MAIL_FROM:-ChordTune <no-reply@localhost>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      VK_CLIENT_SECRET: ${VK_CLIENT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_NAME: ${TELEGRAM_BOT_NAME:-}
      REVIEW_EMAIL: ${REVIEW_EMAIL:-}
      REVIEW_CODE: ${REVIEW_CODE:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: chordtune
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chordtune
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "chordtune", "-d", "chordtune"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.54
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data

volumes:
  postgres-data:
  meili-data:
