name: Release

on:
  push:
    # Only X.Y.Z release tags: anything else has no Android versionCode or semver image tag.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: release-${{ github.ref }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run check-types
      - run: bun run test

  docker:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Adds the mobile bundle that installed apps take as a live update.
          build-args: |
            PUBLIC_URL=${{ vars.PUBLIC_URL }}
      # Arcane pulls the new :latest image and restarts the project; installed apps then follow.
      - name: Deploy
        env:
          ARCANE_WEBHOOK_URL: ${{ secrets.ARCANE_WEBHOOK_URL }}
        run: |
          if [ -z "$ARCANE_WEBHOOK_URL" ]; then
            echo "::notice::ARCANE_WEBHOOK_URL is not set; deploy the image by hand"
            exit 0
          fi
          curl -fsS --retry 3 -X POST "$ARCANE_WEBHOOK_URL"
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: bun install --frozen-lockfile
      - name: Version
        run: |
          version="${VERSION#v}"
          # Assigned on its own line so a version that has no versionCode fails the step.
          code="$(bun scripts/version-code.ts "$version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Web build for Capacitor
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.PUBLIC_URL }}
        run: bun run build:cap && bunx cap sync android
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; run scripts/android-keystore.sh once"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: apps/web/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/web/android/app/build/outputs/apk/release/app-release.apk "ChordTune-$VERSION.apk"
          gh release create "$GITHUB_REF_NAME" --generate-notes "ChordTune-$VERSION.apk"
