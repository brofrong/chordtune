services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: chordtune
      POSTGRES_PASSWORD: chordtune
      POSTGRES_DB: chordtune
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  meilisearch:
    image: getmeili/meilisearch:v1.54
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: chordtune-dev-master-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data

volumes:
  postgres-data:
  meili-data:
